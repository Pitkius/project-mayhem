<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRP Mechanic</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .hidden { display: none !important; }
        #perf-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <iframe id="perf-frame" class="hidden" src="nui://mrp_mechanic/web/dist/index.html" title="Performance UI"></iframe>

    <div id="cosmetic-root">
        <div id="root" class="hidden">
            <div class="workshop">
                <header class="workshop__head">
                    <div class="workshop__brand">
                        <div class="workshop__logo">⚙</div>
                        <div>
                            <h1>Los Santos Customs</h1>
                            <p id="plateLabel">—</p>
                        </div>
                    </div>
                    <div class="workshop__actions">
                        <button type="button" class="btn btn--ghost" id="btnRepair">Remontas</button>
                        <button type="button" class="btn btn--green" id="btnSave">Išsaugoti klientui</button>
                        <button type="button" class="btn btn--close" id="btnClose" title="Uždaryti">✕</button>
                    </div>
                </header>

                <div class="workshop__body">
                    <nav class="workshop__nav" id="nav"></nav>
                    <main class="workshop__main" id="panel"></main>
                </div>

                <footer class="workshop__foot">
                    <span id="hintText">Peržiūra ant transporto — išsaugok tik užbaigus darbą.</span>
                </footer>
            </div>
        </div>
    </div>

    <script src="shell.js"></script>
    <script src="app.js"></script>
</body>
</html>
