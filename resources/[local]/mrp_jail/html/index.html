<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud" class="hidden">
    <div class="panel">
      <div class="title">Bausmė</div>
      <div class="row">
        <span class="label">Liko</span>
        <span id="time" class="value">00:00</span>
      </div>
      <div class="row reason-row">
        <span class="label">Priežastis</span>
        <span id="reason" class="value reason">—</span>
      </div>
      <div class="hint">Pasirenkami darbai lėktuvnešyje trumpina laiką (−1 min)</div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
