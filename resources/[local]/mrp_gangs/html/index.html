<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gang System 2.0</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="tablet" class="tablet is-hidden" aria-hidden="true">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">M</span>
        <div>
          <strong>MAYHEM</strong>
          <small>GANG NETWORK</small>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <div id="identity" class="identity"></div>
        <button class="icon-button" data-action="refresh" title="Atnaujinti">↻</button>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p id="eyebrow" class="eyebrow">GANG SYSTEM 2.0</p>
          <h1 id="page-title">Overview</h1>
        </div>
        <div class="topbar-actions">
          <span id="connection" class="status-dot">LIVE</span>
          <button class="close-button" data-action="close" aria-label="Uždaryti">×</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="vendor/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
