<!doctype html>
<html lang="lt" style="background:transparent!important;background-color:transparent!important">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <title>Mayhem Syndicate</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { background: transparent !important; background-color: transparent !important; }
  </style>
</head>
<body style="background:transparent!important;background-color:transparent!important">
  <main id="tablet" class="tablet is-hidden" aria-hidden="true">
    <div class="tablet-glow" aria-hidden="true"></div>

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <img src="assets/mayhem_mark.png" alt="Mayhem" width="36" height="36" />
        </div>
        <div class="brand-text">
          <strong>MAYHEM</strong>
          <small>SYNDICATE OS</small>
        </div>
      </div>

      <nav id="nav" class="nav" aria-label="Pagrindinė navigacija"></nav>

      <div class="sidebar-footer">
        <div id="identity" class="identity"></div>
        <button class="icon-button" data-action="refresh" title="Atnaujinti duomenis" aria-label="Atnaujinti">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div class="topbar-title">
          <p id="eyebrow" class="eyebrow">SYNDICATE INTERFACE</p>
          <h1 id="page-title">Pagrindinis</h1>
        </div>
        <div class="topbar-actions">
          <span id="clock" class="topbar-clock"></span>
          <span id="connection" class="status-dot"><i></i>LIVE</span>
          <button class="close-button" data-action="close" aria-label="Uždaryti">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <div id="mission-progress" class="mission-progress hidden" aria-hidden="true">
    <div class="mission-progress-panel">
      <div class="mission-progress-title" id="mission-progress-title">Ruošiama...</div>
      <div class="mission-progress-time" id="mission-progress-time">0s</div>
      <div class="mission-progress-bar"><span id="mission-progress-fill"></span></div>
      <div class="mission-progress-hint">Stovi vietoje — BACKSPACE nutraukia</div>
    </div>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
