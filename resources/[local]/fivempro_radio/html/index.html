<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="nui://fivempro_fonts/html/ui.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="radio-app" class="radio-app hidden">
        <div class="radio-stage">
            <button type="button" class="radio-close" id="btnClose" aria-label="Uždaryti">×</button>

            <header class="radio-brand">
                <div class="radio-brand__icon" aria-hidden="true">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="24" cy="24" r="4" fill="currentColor"/>
                        <path d="M12 24c0-6.6 5.4-12 12-12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M36 24c0 6.6-5.4 12-12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M6 24c0-9.9 8.1-18 18-18" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".7"/>
                        <path d="M42 24c0 9.9-8.1 18-18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".7"/>
                    </svg>
                </div>
                <div class="radio-brand__text">
                    <h1>RACIJA</h1>
                    <p>IŠPLĖSTINĖ RACIJOS SISTEMA</p>
                </div>
            </header>

            <div class="radio-device">
                <div class="radio-device__hardware" aria-hidden="true">
                    <div class="radio-antenna"></div>
                    <div class="radio-knob radio-knob--a"></div>
                    <div class="radio-knob radio-knob--b"></div>
                    <div class="radio-side radio-side--l"></div>
                    <div class="radio-side radio-side--r"></div>
                    <div class="radio-grill"></div>
                </div>

                <div class="radio-screen">
                    <div class="screen-status">
                        <span id="screenTime">12:00</span>
                        <div class="screen-status__right">
                            <div class="signal-mini" id="signalMini" aria-hidden="true">
                                <span></span><span></span><span></span><span></span>
                            </div>
                            <span class="screen-batt" id="screenBatt">78%</span>
                        </div>
                    </div>

                    <div class="screen-signal-row">
                        <span class="screen-signal-row__label">SIGNALAS</span>
                        <div class="signal-bars" id="signalBars" aria-hidden="true">
                            <span class="on"></span><span class="on"></span><span class="on"></span><span></span>
                        </div>
                        <span class="screen-lock" id="screenLock" title="Užkoduotas kanalas" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/></svg>
                        </span>
                    </div>

                    <div class="screen-channel">
                        <button type="button" class="ch-arrow" id="btnChPrev" aria-label="Ankstesnis">‹</button>
                        <div class="screen-channel__num" id="screenFreq">--</div>
                        <button type="button" class="ch-arrow" id="btnChNext" aria-label="Kitas">›</button>
                    </div>

                    <div class="screen-title" id="screenLabel">RACIJA</div>
                    <div class="screen-meta">
                        <span id="screenSub">Įveskite dažnį</span>
                        <span class="screen-badge hidden" id="screenBadge">PD</span>
                    </div>
                    <div class="screen-alias" id="screenAlias"></div>

                    <div class="screen-wave" id="screenWave" aria-hidden="true">
                        <canvas id="waveCanvas" width="280" height="48"></canvas>
                    </div>

                    <div class="screen-footer">
                        <span>KANALAS</span>
                        <span class="screen-footer__state" id="screenConn">NEPRISIJUNGTA</span>
                    </div>

                    <button type="button" class="btn-connect" id="btnConnect">
                        <svg class="btn-connect__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <circle cx="12" cy="12" r="2" fill="currentColor"/>
                            <path d="M7 12a5 5 0 0 1 10 0" stroke="currentColor" stroke-width="2" fill="none"/>
                            <path d="M4 12a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".6"/>
                        </svg>
                        <span id="labelConnect">PRISIJUNGTI</span>
                    </button>

                    <div class="screen-actions">
                        <button type="button" class="btn-action" id="btnFreq">
                            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06z"/></svg>
                            <span>DAŽNIS</span>
                        </button>
                        <button type="button" class="btn-action" id="btnSound">
                            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            <span>GARSAS</span>
                            <span class="btn-action__led" id="labelSound">ON</span>
                        </button>
                    </div>
                </div>
            </div>

            <p class="radio-hint">Kalbėti per raciją: <kbd>CAPS LOCK</kbd></p>
        </div>
    </div>

    <div id="modal-freq" class="modal hidden">
        <div class="modal__card">
            <h3>Dažnis ir vardas</h3>
            <input type="number" id="inputFreq" min="1" max="999" placeholder="1, 12, 21..." />
            <label class="field">
                <span>Tavo vardas racijoje (rašyk pats)</span>
                <input type="text" id="inputAlias" maxlength="32" placeholder="pvz. Jonas P. arba LIMA-21" autocomplete="off" />
            </label>
            <div class="modal__actions">
                <button type="button" class="btn btn--ghost" id="btnFreqCancel">Atšaukti</button>
                <button type="button" class="btn btn--primary" id="btnFreqOk">Patvirtinti</button>
            </div>
            <p class="modal__hint" id="freqHint"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
