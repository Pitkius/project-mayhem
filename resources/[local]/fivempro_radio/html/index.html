<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="nui://fivempro_fonts/html/ui.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="radio-app" class="radio-app hidden">
        <div class="radio-wrap">
            <button type="button" class="radio-close" id="btnClose" aria-label="Uždaryti">×</button>

            <div class="radio-chassis">
                <div class="radio-body" aria-hidden="true">
                    <div class="radio-body__antenna"></div>
                    <div class="radio-body__speaker"></div>
                    <div class="radio-body__knob radio-body__knob--l"></div>
                    <div class="radio-body__knob radio-body__knob--r"></div>
                </div>

                <div class="radio-screen">
                    <div class="radio-screen__top">
                        <span id="screenTime">12:00</span>
                        <span id="screenBatt">PWR</span>
                    </div>
                    <div class="radio-screen__freq" id="screenFreq">--</div>
                    <div class="radio-screen__label" id="screenLabel">RACIJA</div>
                    <div class="radio-screen__sub" id="screenSub">Įveskite dažnį</div>
                    <div class="radio-screen__alias" id="screenAlias"></div>
                    <div class="radio-screen__wave" aria-hidden="true">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>

                <button type="button" class="radio-hit radio-hit--freq" id="btnFreq" title="Dažnis ir vardas"></button>
                <button type="button" class="radio-hit radio-hit--sound" id="btnSound" title="Garsas"></button>
                <button type="button" class="radio-hit radio-hit--connect" id="btnConnect" title="Prisijungti / atjungti"></button>
            </div>

            <p class="radio-hint">Kalbėti: <kbd>CAPS LOCK</kbd> · reikia <strong>pma-voice</strong></p>
        </div>
    </div>

    <div id="modal-freq" class="modal hidden">
        <div class="modal__card modal__card--radio">
            <h3>Dažnis ir vardas</h3>
            <input type="number" id="inputFreq" min="1" max="999" placeholder="pvz. 1, 12, 21..." />
            <label class="field">
                <span>Tavo vardas racijoje (rašyk pats)</span>
                <input type="text" id="inputAlias" maxlength="32" placeholder="pvz. Jonas P. arba LIMA-21" autocomplete="off" />
            </label>
            <div class="modal__actions">
                <button type="button" class="btn btn--ghost" id="btnFreqCancel">Atšaukti</button>
                <button type="button" class="btn btn--primary" id="btnFreqOk">Patvirtinti</button>
            </div>
            <p class="modal__hint" id="freqHint"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
