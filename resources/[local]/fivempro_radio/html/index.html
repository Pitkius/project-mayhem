<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="nui://fivempro_fonts/html/ui.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="radio-app" class="radio-app hidden">
        <div class="mm-wrap">
            <div class="mm-radio">
                <div class="mm-top">
                    <div class="mm-knob" aria-hidden="true"></div>
                    <span class="mm-preset-label">PRESET</span>
                    <div class="mm-antenna" aria-hidden="true"></div>
                </div>

                <div class="mm-brand">
                    <svg class="mm-logo" viewBox="0 0 40 28" aria-hidden="true">
                        <rect x="4" y="14" width="5" height="10" rx="1" fill="currentColor"/>
                        <rect x="13" y="8" width="5" height="16" rx="1" fill="currentColor"/>
                        <rect x="22" y="2" width="5" height="22" rx="1" fill="currentColor"/>
                    </svg>
                    <span class="mm-brand-text">MEINMACHT</span>
                </div>

                <div class="mm-lcd" id="mmLcd">
                    <div class="mm-lcd-freq" id="lcdFreq">--.--</div>
                    <div class="mm-lcd-meta" id="lcdMeta"></div>
                </div>

                <div class="mm-pad">
                    <button type="button" class="mm-key" id="btnPower" title="Uždaryti">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0 1 19 12a7 7 0 0 1-7 7 7 7 0 0 1-7-7c0-2.08.9-3.95 2.34-5.24L6.17 5.17A8.96 8.96 0 0 0 3 12a9 9 0 1 0 18 0c0-2.48-1.01-4.73-2.64-6.36z"/></svg>
                    </button>
                    <button type="button" class="mm-key" id="btnUp" title="Dažnis +">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8l-6 6h12z"/></svg>
                    </button>
                    <button type="button" class="mm-key mm-key--num" id="btn1" title="Prisijungti">1</button>

                    <button type="button" class="mm-key" id="btnMute" title="Garsas">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03zM5 9v6h4l5 5V4L9 9H5z"/></svg>
                    </button>
                    <button type="button" class="mm-key" id="btnDown" title="Dažnis -">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 16l6-6H6z"/></svg>
                    </button>
                    <button type="button" class="mm-key mm-key--num" id="btn2" title="Dažnis / vardas">2</button>
                </div>

                <div class="mm-grill" aria-hidden="true"></div>
            </div>

            <p class="mm-hint">Kalbėti: <kbd>CAPS LOCK</kbd></p>
        </div>
    </div>

    <div id="modal-freq" class="modal hidden">
        <div class="modal__card">
            <h3>Dažnis ir vardas</h3>
            <input type="number" id="inputFreq" min="1" max="999" placeholder="1, 12, 21..." />
            <label class="field">
                <span>Tavo vardas racijoje</span>
                <input type="text" id="inputAlias" maxlength="32" placeholder="pvz. Jonas P." autocomplete="off" />
            </label>
            <div class="modal__actions">
                <button type="button" class="btn btn--ghost" id="btnFreqCancel">Atšaukti</button>
                <button type="button" class="btn btn--primary" id="btnFreqOk">Patvirtinti</button>
            </div>
            <p class="modal__hint" id="freqHint"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
