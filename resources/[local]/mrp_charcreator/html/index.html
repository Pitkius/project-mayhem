<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personažo kūrimas</title>
  <link rel="stylesheet" href="nui://mrp_fonts/html/ui.css" />
  <link rel="stylesheet" href="style.css" />
    <script src="nui://mrp_fonts/html/theme.js"></script>
</head>
<body>
  <div id="app" class="hidden">
    <div class="cc-ambient" aria-hidden="true"></div>
    <section id="screenWizard" class="screen">
      <aside class="sidebar glass">
        <div class="brand"><i class="fa-solid fa-user-astronaut" aria-hidden="true"></i> Personažas</div>
        <nav id="stepNav"></nav>
        <div class="sidebar-tools">
          <button type="button" id="btnRandom" class="btn ghost sm"><i class="fa-solid fa-dice" aria-hidden="true"></i> Atsitiktinis</button>
          <button type="button" id="btnSavePreset" class="btn ghost sm"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Išsaugoti preset</button>
          <button type="button" id="btnLoadPreset" class="btn ghost sm"><i class="fa-solid fa-folder-open" aria-hidden="true"></i> Įkelti preset</button>
        </div>
      </aside>
      <main class="wizard-main glass">
        <header class="wizard-head">
          <h2 id="stepTitle">Asmeninė informacija</h2>
          <p id="stepDesc" class="muted">Užpildyk pagrindinius duomenis</p>
        </header>
        <div id="stepBody" class="step-body"></div>
        <footer class="wizard-foot">
          <button type="button" id="btnCancel" class="btn ghost hidden"><i class="fa-solid fa-xmark" aria-hidden="true"></i> Atšaukti</button>
          <button type="button" id="btnBack" class="btn ghost"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Grįžti</button>
          <button type="button" id="btnNext" class="btn primary">Toliau <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
        </footer>
      </main>
    </section>
    <aside class="char-view-hint glass" id="charViewHint">
      <p class="preview-label"><i class="fa-solid fa-eye" aria-hidden="true"></i> Tavo personažas</p>
      <p class="muted">Peržiūra dešinėje — sukite kamerą rodyklėmis</p>
      <p class="cam-hint"><i class="fa-solid fa-rotate" aria-hidden="true"></i> ← → 360°</p>
      <div id="reviewBox" class="review-box hidden"></div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
