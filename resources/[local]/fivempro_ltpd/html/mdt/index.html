<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LTPD MDT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden">
    <header class="top">
      <div class="brand">LTPD <span>MDT</span></div>
      <button type="button" id="btnClose" class="btn danger">Uždaryti (ESC)</button>
    </header>
    <nav class="tabs">
      <button type="button" data-tab="person" class="tab active">Asmuo</button>
      <button type="button" data-tab="veh" class="tab">Transportas</button>
      <button type="button" data-tab="fine" class="tab" id="tabFine">Bauda</button>
      <button type="button" data-tab="want" class="tab" id="tabWant">Paieška</button>
      <button type="button" data-tab="calls" class="tab">Iškvietimai</button>
      <button type="button" data-tab="crews" class="tab">Ekipažai</button>
      <button type="button" data-tab="units" class="tab">Žemėlapis</button>
    </nav>
    <main>
      <section id="panel-person" class="panel">
        <div class="row">
          <input type="text" id="qPerson" placeholder="Vardas, pavardė arba citizenid…" />
          <button type="button" id="goPerson" class="btn">Ieškoti</button>
        </div>
        <div id="personResults" class="results"></div>
      </section>
      <section id="panel-veh" class="panel hidden">
        <div class="row">
          <input type="text" id="qPlate" placeholder="Numeriai…" />
          <button type="button" id="goVeh" class="btn">Ieškoti</button>
        </div>
        <div id="vehResults" class="results"></div>
      </section>
      <section id="panel-fine" class="panel hidden">
        <div class="grid2">
          <label>citizenid <input type="text" id="fineCid" /></label>
          <label>Suma € <input type="number" id="fineAmt" /></label>
        </div>
        <label>Priežastis
          <select id="finePreset"></select>
        </label>
        <label>Pastaba <input type="text" id="fineLabel" /></label>
        <button type="button" id="goFine" class="btn primary">Išrašyti baudą</button>
      </section>
      <section id="panel-want" class="panel hidden">
        <div class="grid2">
          <label>citizenid <input type="text" id="wantCid" /></label>
          <label>Lygis (0–5) <input type="number" id="wantLvl" min="0" max="5" value="0" /></label>
        </div>
        <label>Priežastis <input type="text" id="wantReason" /></label>
        <button type="button" id="goWant" class="btn primary">Nustatyti paieškomumą</button>
      </section>
      <section id="panel-calls" class="panel hidden">
        <div class="row">
          <button type="button" id="refreshDispatch" class="btn">Atnaujinti</button>
        </div>
        <div id="dispatchCalls" class="results"></div>
      </section>
      <section id="panel-crews" class="panel hidden">
        <div class="row">
          <input type="text" id="crewCallsign" placeholder="Šaukinys pvz. LIMA67" />
          <input type="text" id="crewIdInput" placeholder="Ekipažo ID (CRW-...)" />
          <input type="number" id="crewMemberId" placeholder="Nario server ID" />
          <button type="button" id="btnSetCallsign" class="btn">Nustatyti šaukinį</button>
          <button type="button" id="btnCreateCrew" class="btn">Kurti ekipažą</button>
          <button type="button" id="btnJoinCrew" class="btn">Prisijungti</button>
          <button type="button" id="btnAddCrewMember" class="btn">Pridėti narį</button>
          <button type="button" id="btnDeleteCrew" class="btn danger">Trinti ekipažą</button>
          <button type="button" id="btnLeaveCrew" class="btn">Išeiti</button>
          <button type="button" id="btnPanic" class="btn danger">PANIC</button>
        </div>
        <div id="dispatchCrews" class="results"></div>
      </section>
      <section id="panel-units" class="panel hidden">
        <div class="row">
          <button type="button" id="refreshDispatchMap" class="btn">Atnaujinti map</button>
        </div>
        <div class="tactical-wrap">
          <div id="dispatchMap" class="dispatch-map">
            <div id="dispatchMapTransform" class="dispatch-map-transform">
              <div id="dispatchMapInner" class="dispatch-map-inner" aria-hidden="true"></div>
              <div id="dispatchMapMarkers" class="dispatch-map-markers"></div>
            </div>
            <div class="dispatch-map-zoom" aria-hidden="true">
              <button type="button" class="dispatch-zoom-btn" id="dispatchZoomIn" title="Priartinti">+</button>
              <button type="button" class="dispatch-zoom-btn" id="dispatchZoomOut" title="Nutolinti">−</button>
            </div>
          </div>
          <div id="dispatchUnits" class="results side-list"></div>
        </div>
      </section>
    </main>
    <footer class="hint">Server-side tikrinimas • RB AC • Fivempro LTPD</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
