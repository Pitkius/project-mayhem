<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone</title>
  <link rel="stylesheet" href="nui://mrp_fonts/html/ui.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="phone-apps.css" />
  <link rel="stylesheet" href="phone-ads.css" />
  <link rel="stylesheet" href="phone-bank.css" />
  <link rel="stylesheet" href="phone-weather.css" />
  <link rel="stylesheet" href="phone-notes.css" />
  <link rel="stylesheet" href="phone-darknet.css" />
  <link rel="stylesheet" href="death-screen.css" />
</head>
<body>
  <div id="deathScreen" class="death-screen" aria-hidden="true">
    <div class="death-vignette"></div>
    <div class="death-blood-edge death-blood-edge--top"></div>
    <div class="death-blood-edge death-blood-edge--bottom"></div>
    <div class="death-drops" id="deathDrops"></div>
    <div class="death-content">
      <div class="death-panel">
        <h1 class="death-title" id="deathTitle">MIRĘS</h1>
        <div class="death-divider"></div>
        <p class="death-line death-line--primary" id="deathLine1">Spausk <span class="death-key">G</span> — iškviesti medikus</p>
        <p class="death-line death-line--accent" id="deathLine2">EMS pamatys tavo vietą žemėlapyje</p>
        <p class="death-line death-line--timer" id="deathLine3">Liko 0:00 — tada laikyk G ligoninėje</p>
      </div>
    </div>
  </div>

  <div id="phone" class="hidden">
    <div class="device">
      <div class="device-wallpaper" id="deviceWallpaper"></div>
      <div class="device-glass"></div>

      <div class="statusbar ios-bar">
        <span id="statusTime">09:41</span>
        <span class="status-icons" aria-hidden="true">
          <span class="sig"></span><span class="wifi"></span><span class="bat"></span>
        </span>
      </div>

      <section id="lockScreen" class="screen lock-screen">
        <div class="lock-time" id="lockTime">09:41</div>
        <div class="lock-date" id="lockDate">Antradienis, gegužės 19</div>
        <div class="lock-notifs" id="lockNotifs"></div>
        <div class="pin-panel glass-panel" id="pinPanel">
          <div class="pin-title" id="pinTitle">Įveskite PIN</div>
          <div class="pin-dots" id="pinDots" aria-hidden="true">••••</div>
          <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" />
          <div class="pin-pad" id="pinPad">
            <button type="button" data-pin="1">1</button>
            <button type="button" data-pin="2">2</button>
            <button type="button" data-pin="3">3</button>
            <button type="button" data-pin="4">4</button>
            <button type="button" data-pin="5">5</button>
            <button type="button" data-pin="6">6</button>
            <button type="button" data-pin="7">7</button>
            <button type="button" data-pin="8">8</button>
            <button type="button" data-pin="9">9</button>
            <button type="button" data-pin="clear">C</button>
            <button type="button" data-pin="0">0</button>
            <button type="button" data-pin="ok">OK</button>
          </div>
          <div id="pinState" class="muted small"></div>
        </div>
      </section>

      <section id="accountSetup" class="screen hidden setup-screen glass-panel">
        <h2>Naujas telefonas</h2>
        <p class="muted">Susikurkite 4 skaitmenų PIN. Jis saugo šį įrenginį.</p>
        <input id="setupPin" type="password" inputmode="numeric" placeholder="PIN (4 sk.)" maxlength="4" />
        <input id="setupPin2" type="password" inputmode="numeric" placeholder="Pakartokite PIN" maxlength="4" />
        <button id="btnCreateAccount" class="ios-btn primary">Aktyvuoti</button>
        <div id="setupState" class="muted small"></div>
      </section>

      <section id="homeScreen" class="screen hidden home-screen">
        <div class="home-header">
          <span id="profileName" class="home-greeting">Sveiki</span>
        </div>
        <div class="home-pages-wrap">
          <div class="home-pages" id="homePages"></div>
        </div>
        <div class="page-dots" id="pageDots"></div>
        <div class="dock glass" id="dockBar"></div>
        <div id="callState" class="call-state muted small"></div>
      </section>

      <section id="appStoreScreen" class="screen hidden app-screen-layer">
        <header class="app-nav glass">
          <button type="button" data-back-home="1" class="nav-back">&lt;</button>
          <span>Programėlės</span>
          <span class="nav-spacer"></span>
        </header>
        <div id="storeList" class="scroll-body list"></div>
      </section>

      <section id="appScreen" class="screen hidden app-screen-layer">
        <header class="app-nav glass">
          <button type="button" data-back-home="1" class="nav-back">&lt;</button>
          <span id="appTitle">Programėlė</span>
          <button type="button" id="openStore" class="nav-link">Parduotuvė</button>
        </header>
        <div id="appContent" class="scroll-body"></div>
      </section>

      <div id="callOverlay" class="call-overlay hidden" aria-hidden="true">
        <div class="call-sheet">
          <div class="call-avatar" aria-hidden="true">Tel</div>
          <div id="callOverlayTitle" class="call-title">Įeinantis skambutis</div>
          <div id="callOverlaySub" class="call-sub">—</div>
          <div class="call-actions">
            <button type="button" class="call-btn reject" id="callReject">Atmesti</button>
            <button type="button" class="call-btn accept" id="callAccept">Atsiliepti</button>
          </div>
        </div>
      </div>

      <button type="button" class="home-indicator" id="homeBar" aria-label="Pradžia"></button>
    </div>
  </div>

  <script src="locale/lt.js"></script>
  <script src="phone-image.js"></script>
  <script src="apps.js"></script>
  <script src="phone-camera.js"></script>
  <script src="phone-carplay.js"></script>
  <script src="phone-ads.js"></script>
  <script src="phone-bank-icons.js"></script>
  <script src="phone-bank.js"></script>
  <script src="phone-weather.js"></script>
  <script src="phone-notes.js"></script>
  <script src="phone-darknet.js"></script>
  <script src="death-screen.js"></script>
  <script src="app.js"></script>
</body>
</html>
