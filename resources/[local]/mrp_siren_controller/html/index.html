<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emergency Siren Controller</title>
    <link rel="stylesheet" href="nui://mrp_fonts/html/ui.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="scRoot" class="sc-root hidden">
        <div class="sc-backdrop" id="scBackdrop"></div>
        <div class="sc-panel" id="scPanel">
            <header class="sc-header">
                <div class="sc-brand">
                    <span class="sc-brand-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l7 4v6c0 5-3.5 9.5-7 11-3.5-1.5-7-6-7-11V6l7-4z" stroke="currentColor" stroke-width="1.6"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    <div class="sc-brand-text">
                        <span class="sc-brand-kicker">fivemprojektas</span>
                        <h1>EMERGENCY SIREN CONTROLLER</h1>
                    </div>
                </div>
                <div class="sc-vehicle-info">
                    <div class="sc-vi-row">
                        <svg class="sc-vi-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z"/></svg>
                        <span id="scVehicleName" class="sc-vi-val">—</span>
                    </div>
                    <div class="sc-vi-row">
                        <span class="sc-vi-k">Statusas</span>
                        <span id="scCodeStatus" class="sc-vi-badge sc-vi-off">OFF</span>
                    </div>
                    <div class="sc-vi-row">
                        <span class="sc-vi-k">Aktyvi sirena</span>
                        <span id="scToneStatus" class="sc-vi-tone">—</span>
                    </div>
                </div>
                <button type="button" class="sc-close" id="scClose" title="Uždaryti">×</button>
            </header>

            <div class="sc-body">
                <section class="sc-section">
                    <h2 class="sc-section-title">EMERGENCY MODES</h2>
                    <div class="sc-code-grid">
                        <button type="button" class="sc-code sc-code-1" data-code="lights" id="btnCode1">
                            <span class="sc-code-glow" aria-hidden="true"></span>
                            <span class="sc-code-ico" aria-hidden="true">
                                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg>
                            </span>
                            <strong>CODE 1</strong>
                            <span class="sc-code-sub">Švyturėliai</span>
                            <small>Tik švyturėliai — be garso</small>
                        </button>
                        <button type="button" class="sc-code sc-code-2" data-code="sound" id="btnCode2">
                            <span class="sc-code-glow" aria-hidden="true"></span>
                            <span class="sc-code-ico" aria-hidden="true">
                                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </span>
                            <strong>CODE 2</strong>
                            <span class="sc-code-sub">Garso signalas</span>
                            <small>Tik sirena — be švyturėlių</small>
                        </button>
                        <button type="button" class="sc-code sc-code-3" data-code="full" id="btnCode3">
                            <span class="sc-code-glow" aria-hidden="true"></span>
                            <span class="sc-code-ico" aria-hidden="true">
                                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                            </span>
                            <strong>CODE 3</strong>
                            <span class="sc-code-sub">Pilnas reagavimas</span>
                            <small>Sirena + švyturėliai</small>
                        </button>
                    </div>
                </section>

                <div class="sc-mid-row">
                    <section class="sc-section sc-section-tones">
                        <h2 class="sc-section-title">SIRENOS REŽIMAI</h2>
                        <div class="sc-tone-grid">
                            <button type="button" class="sc-tone" data-tone="wail" id="btnWail">
                                <span class="sc-tone-ico" aria-hidden="true">
                                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                                </span>
                                <strong>WAIL</strong>
                                <span>Lėta ilga sirena</span>
                                <small>Ilgesnėse gatvėse</small>
                            </button>
                            <button type="button" class="sc-tone" data-tone="yelp" id="btnYelp">
                                <span class="sc-tone-ico" aria-hidden="true">
                                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
                                </span>
                                <strong>YELP</strong>
                                <span>Greitesnė sirena</span>
                                <small>Miesto centre</small>
                            </button>
                            <button type="button" class="sc-tone" data-tone="priority" id="btnPriority">
                                <span class="sc-tone-ico" aria-hidden="true">
                                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
                                </span>
                                <strong>PRIORITY</strong>
                                <span>Agresyvus signalas</span>
                                <small>Kamščiams / perspėjimui</small>
                            </button>
                        </div>
                    </section>

                    <aside class="sc-schematic" aria-label="Šviesų schema">
                        <div class="sc-schematic-label">LUXART PANEL</div>
                        <div class="sc-car-top">
                            <svg viewBox="0 0 120 200" class="sc-car-svg" aria-hidden="true">
                                <rect x="34" y="20" width="52" height="160" rx="14" fill="rgba(30,27,52,0.9)" stroke="rgba(167,139,250,0.35)" stroke-width="1.5"/>
                                <rect x="42" y="32" width="36" height="48" rx="6" fill="rgba(15,12,28,0.85)" stroke="rgba(255,255,255,0.08)"/>
                                <rect x="42" y="120" width="36" height="44" rx="6" fill="rgba(15,12,28,0.85)" stroke="rgba(255,255,255,0.08)"/>
                            </svg>
                            <span class="sc-light sc-light-fl" id="lightFl"></span>
                            <span class="sc-light sc-light-fr" id="lightFr"></span>
                            <span class="sc-light sc-light-rl" id="lightRl"></span>
                            <span class="sc-light sc-light-rr" id="lightRr"></span>
                            <span class="sc-light sc-light-bar" id="lightBar"></span>
                        </div>
                        <div class="sc-schematic-stages">
                            <span class="sc-stage" id="stageS1">S-1</span>
                            <span class="sc-stage" id="stageS2">S-2</span>
                            <span class="sc-stage" id="stageS3">S-3</span>
                        </div>
                    </aside>
                </div>

                <section class="sc-section sc-section-extra">
                    <div class="sc-extra-grid">
                        <button type="button" class="sc-extra" data-action="airhorn" id="btnAirhorn">
                            <span class="sc-extra-ico" aria-hidden="true">📯</span>
                            <strong>AIRHORN</strong>
                            <small>Vienkartinis signalas</small>
                        </button>
                        <button type="button" class="sc-extra sc-extra-manual" data-action="manual" id="btnManual">
                            <span class="sc-extra-ico" aria-hidden="true">🎤</span>
                            <strong>MANUAL</strong>
                            <small>Laikyk — groja sirena</small>
                        </button>
                        <button type="button" class="sc-extra sc-extra-mute" data-action="mute" id="btnMute">
                            <span class="sc-extra-ico" aria-hidden="true">🔇</span>
                            <strong>MUTE</strong>
                            <small>Išjungia visą garsą</small>
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
