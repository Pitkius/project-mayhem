<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fivempro Phone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="phone" class="hidden">
    <div id="callOverlay" class="call-overlay hidden" aria-hidden="true">
      <div class="call-sheet glass">
        <div class="call-avatar" aria-hidden="true">📶</div>
        <div id="callOverlayTitle" class="call-title">Įeinantis skambutis</div>
        <div id="callOverlaySub" class="call-sub">—</div>
        <div class="call-actions">
          <button type="button" class="call-btn reject" id="callReject">Atmesti</button>
          <button type="button" class="call-btn accept" id="callAccept">Atsiliepti</button>
        </div>
      </div>
    </div>
    <div class="statusbar">
      <span id="timeText">09:41</span>
      <span id="meNumber">Nr: 000000</span>
      <button id="btnClose">X</button>
    </div>

    <section id="accountSetup" class="screen hidden">
      <h2>Welcome</h2>
      <p class="small">Pirmas paleidimas: susikurk telefono paskyrą.</p>
      <input id="setupUsername" placeholder="Username" maxlength="24" />
      <input id="setupPassword" type="password" placeholder="Slaptažodis" maxlength="32" />
      <button id="btnCreateAccount">Sukurti paskyrą</button>
      <div id="setupState" class="small"></div>
    </section>

    <section id="homeScreen" class="screen hidden">
      <div class="titlebar">
        <span id="profileName">Player</span>
        <button id="openStore">App Store</button>
      </div>
      <div id="appGrid" class="app-grid"></div>
      <div id="callState" class="small"></div>
    </section>

    <section id="appStoreScreen" class="screen hidden">
      <div class="titlebar">
        <span>App Store</span>
        <button data-back-home="1">Back</button>
      </div>
      <div id="storeList" class="list"></div>
    </section>

    <section id="appScreen" class="screen hidden">
      <div class="titlebar">
        <span id="appTitle">App</span>
        <button data-back-home="1">Home</button>
      </div>
      <div id="appContent"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
