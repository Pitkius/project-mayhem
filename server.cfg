# PRIVALO būti prieš exec — kitaip serveris gali pasilikti sename build.
# 3717 = A Safehouse in the Hills (mansion). Kortz Center (3788) dar nenaudojamas.
sv_enforceGameBuild 3717

# Loadscreen turi būti pirmas (prieš visus cfg), bet šriftai — prieš loadscreen NUI
ensure mrp_fonts
