# ----------------------------------------
# FiveM server config (modular)
# ----------------------------------------

# PRIVALO būti prieš exec — kitaip serveris gali pasilikti naujesniame build.
# 3095 = Bottom Dollar Bounties (senesnis stabilus; PD carcols šviesoms).
# 3717/3788 laikinai nenaudojami — Safehouse mansion / Kortz gali neveikti.
sv_enforceGameBuild 3095

# Loadscreen turi būti pirmas (prieš visus cfg), bet šriftai — prieš loadscreen NUI
ensure mrp_fonts
ensure mrp_loadscreen

exec cfg/00_base.cfg
exec cfg/10_core.cfg
exec cfg/20_qb.cfg
exec cfg/25_voice.cfg
exec cfg/15_mlo.cfg
exec cfg/30_custom.cfg
# Nuolatiniai adminai (automatiškai pildoma /addpermission) — po RR lieka
exec cfg/admins_persistent.cfg
exec cfg/99_build_enforce.cfg

# Paskutinė eilutė — build privalo likti 3095 (PD šviesų testas).
sv_enforceGameBuild 3095
