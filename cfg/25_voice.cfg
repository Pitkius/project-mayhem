# ----------------------------------------
# Balsas — pma-voice (artimas, ne globalus)
# Resursas: resources/[voice]/pma-voice
# ----------------------------------------

ensure pma-voice

# Artimas balsas (native audio + proximity režimai)
setr voice_useNativeAudio true
# false — pma-voice rekomenduoja (klientai naudoja poziciją; mažiau įspėjimų)
setr voice_useSendingRangeOnly false

# UI: rodo šnabždesys / normalu / šauksmas
setr voice_enableUi 1
setr voice_enableProximityCycle 1
setr voice_defaultVoiceMode 2

# ` (GRAVE / liet. klaviatūros ~) — keisti balso atstumą (garsumą/atstumą)
setr voice_defaultCycle "GRAVE"

# Racija (mrp_radio) — CAPS LOCK
setr voice_enableRadios 1
setr voice_enableSubmix 1
setr voice_enableRadioAnim 1
setr voice_defaultRadio "CAPITAL"
setr voice_defaultRadioVolume 35
setr voice_defaultCallVolume 60
