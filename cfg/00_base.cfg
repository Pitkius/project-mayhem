# ----------------------------------------
# Base server settings
# ----------------------------------------

# Šriftai + ikonos (FontAwesome) — prieš bet kurį NUI
ensure mrp_fonts
# GTA-style loading screen (turi būti prieš žaidėjų join)
ensure mrp_loadscreen

sv_hostname "Mayhem Roleplay"
sv_maxclients 48
sets sv_projectName "Mayhem Roleplay"
sets sv_projectDesc "Mayhem Roleplay — Los Santos"
sets locale "lt-LT"
load_server_icon "server-icon.png"
setr qb_locale "lt"

# Chat: nerodyti „* vardas joined / left“ pranešimų visiems
set chat_showJoins 0
set chat_showQuits 0

# RCON (optional local)
rcon_password "mrp_Rcon_2026!"

# Network
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# License key
sv_licenseKey "cfxk_1DMcR81EOwDHkFjZTHeHr_4FOX1j"

# Optional APIs
set steam_webApiKey "none"

# Database (oxmysql)
set mysql_connection_string "mysql://fivem:StiprusSlaptazodis123!@127.0.0.1/fivempro?charset=utf8mb4"

# OneSync Infinity — būtina 32+ slotams; sinchronizuoja žaidėjus/NPC/pasaulį
set onesync infinity
# Jei naudoji txAdmin: Settings → FXServer → OneSync → „Infinity“ (turi sutapti su cfg)

# Recommended build (3095 = Bottom Dollar — senesnis; PD carcols). 3717/3788 laikinai off.
sv_enforceGameBuild 3095

# Admin / QBCore teisės (žr. https://docs.qbcore.org — Permissions)
# txAdmin: Settings -> Admins -> tavo vardas -> Role: Administrator (ne Moderator).
# Po prisijungimo mrp_spawnfix automatiškai duoda qbcore.god. Jei neveikia: /fixadmin
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.qb-core command allow
add_ace resource.qb-core command.add_ace allow
add_ace resource.qb-core command.add_principal allow

# QBCore komandos pagal lygį
add_ace qbcore.god command allow
add_ace qbcore.admin command allow
add_ace qbcore.mod command allow

# Lygių hierarchija: god → admin → mod (žemesni lygiai paveldi aukštesnius)
add_principal qbcore.god qbcore.admin
add_principal qbcore.admin qbcore.mod
add_principal qbcore.god group.admin
add_principal group.admin qbcore.god

# Nuolatinis admin (license iš txAdmin → Players → IDs)
add_principal identifier.license:c10b91e28acd364c907fdc67ca31d6fea179a8ce qbcore.god
add_principal identifier.license:c10b91e28acd364c907fdc67ca31d6fea179a8ce group.admin
add_principal identifier.license:d52ecea740ab4ed31c76c4539e56eca5b8e6ea30 qbcore.god
add_principal identifier.license:d52ecea740ab4ed31c76c4539e56eca5b8e6ea30 group.admin
add_principal identifier.fivem:14287858 qbcore.god

# ── Dev / monitoring (žr. https://docs.fivem.net/docs/client-manual/console-commands/)
# resmon — tik ŽAIDĖJO F8 konsolėje (ne txAdmin serverio konsolėje).
#   FiveM shortcut Target gale: +set moo 31337  (arba Settings → Update channel: Beta)
# Serverio resursų profilis (txAdmin Live Console):
#   profiler record 300
#   profiler view
add_ace group.admin command.profiler allow
add_ace group.admin command.profiler_record allow
add_ace group.admin command.resmon allow
add_ace qbcore.god command.profiler allow
add_ace qbcore.god command.profiler_record allow
add_ace qbcore.god command.resmon allow

# Žaidėjas turi būti ONLINE:
#   addpermission [server_id] god
#   /grantadmin [server_id] god
# Nuo šiol automatiškai rašoma į cfg/admins_persistent.cfg (license) — po RR lieka.
# Jei komandos neveikia po reconnect: /fixadmin
