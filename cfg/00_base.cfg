# ----------------------------------------
# Base server settings
# ----------------------------------------

# Šriftai + ikonos (FontAwesome) — prieš bet kurį NUI
ensure fivempro_fonts
# GTA-style loading screen (turi būti prieš žaidėjų join)
ensure fivempro_loadscreen

sv_hostname "FIVEMPROJEKTAS — Los Santos RP"
sv_maxclients 8
sets sv_projectName "FIVEMPROJEKTAS"
sets sv_projectDesc "Lietuviškas QBCore roleplay serveris"
sets locale "lt-LT"
setr qb_locale "lt"

# Chat: nerodyti „* vardas joined / left“ pranešimų visiems
set chat_showJoins 0
set chat_showQuits 0

# RCON (optional local)
rcon_password "FIVEMPRO_Rcon_2026!"

# Network
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# License key
sv_licenseKey "cfxk_1DMcR81EOwDHkFjZTHeHr_4FOX1j"

# Optional APIs
set steam_webApiKey "none"

# Database (oxmysql)
set mysql_connection_string "mysql://fivem:StiprusSlaptazodis123!@127.0.0.1/fivempro?charset=utf8mb4"

# OneSync must be configured in txAdmin UI
# set onesync on

# Recommended build
set sv_enforceGameBuild 3095

# Admin / QBCore teisės (žr. https://docs.qbcore.org — Permissions)
# txAdmin: Settings -> Admins -> tavo vardas -> Role: Administrator (ne Moderator).
# Po prisijungimo fivempro_spawnfix automatiškai duoda qbcore.god. Jei neveikia: /fixadmin
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.qb-core command allow
add_ace resource.qb-core command.add_ace allow
add_ace resource.qb-core command.add_principal allow

# QBCore komandos pagal lygį
add_ace qbcore.god command allow
add_ace qbcore.admin command allow
add_ace qbcore.mod command allow

# Lygių hierarchija: god → admin → mod (žemesni lygiai paveldi aukštesnius)
add_principal qbcore.god qbcore.admin
add_principal qbcore.admin qbcore.mod
add_principal qbcore.god group.admin
add_principal group.admin qbcore.god

# Nuolatinis admin (license iš txAdmin → Players → IDs) — atkomentuok ir įrašyk ID:
# add_principal identifier.license:XXXXXXXX qbcore.god
# add_principal identifier.fivem:12345678 qbcore.god

# Žaidėjas turi būti ONLINE. Konsolėje (F8) arba txAdmin:
#   addpermission [server_id] god
#   addpermission [server_id] admin
# server_id = skaičius šalia vardo (NE citizenid). Po reconnect reikia cfg arba txAdmin vėl.
