name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Deploy on VPS self-hosted runner
        run: |
          set -euxo pipefail
          REPO_DIR="/home/fivem/FIVEMPROJEKTAS"
          SERVER_DIR="/home/fivem/server"

          echo "[deploy] runner user: $(whoami)"
          test -d "$REPO_DIR"
          test -d "$SERVER_DIR"

          cd "$REPO_DIR"
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          git clean -fd
          git submodule sync --recursive
          git submodule update --init --recursive

          echo "[deploy] Atnaujinami FXServer artifacts (3095 palaikymui)..."
          sudo -n systemctl stop fivem-txadmin || true
          sleep 5
          if ! bash "$REPO_DIR/scripts/update-fivem-artifacts.sh" "$SERVER_DIR"; then
            echo "[deploy] WARNING: artifact atnaujinimas nepavyko — tęsiame deploy be artifact update"
          fi
          if [ "$SERVER_DIR" != "$REPO_DIR" ] && [ -d "$REPO_DIR/alpine" ]; then
            bash "$REPO_DIR/scripts/update-fivem-artifacts.sh" "$REPO_DIR" || echo "[deploy] REPO artifact update skipped/failed"
          fi

          sync_resources() {
            local target="$1"
            local use_sudo="${2:-1}"
            [ -d "$target" ] || return 0
            echo "[deploy] Sync resources/cfg -> $target"
            if [ "$use_sudo" = "1" ]; then
              sudo -n mkdir -p "$target/resources" "$target/cfg"
              sudo -n rsync -a --delete "$REPO_DIR/resources/" "$target/resources/"
              sudo -n rsync -a --delete --exclude '00_base.cfg' "$REPO_DIR/cfg/" "$target/cfg/"
            else
              mkdir -p "$target/resources" "$target/cfg"
              rsync -a --delete "$REPO_DIR/resources/" "$target/resources/"
              rsync -a --delete --exclude '00_base.cfg' "$REPO_DIR/cfg/" "$target/cfg/"
            fi
          }

          # Tik runtime serverio katalogui — ne repo (git reset jau atnaujina server.cfg).
          sync_server_cfg() {
            local target="$1"
            [ -d "$target" ] || return 0
            echo "[deploy] Sync server.cfg -> $target"
            sudo -n cp "$REPO_DIR/server.cfg" "$target/server.cfg"
          }

          sync_resources "$SERVER_DIR" 1
          sync_server_cfg "$SERVER_DIR"
          if [ "$SERVER_DIR" != "$REPO_DIR" ]; then
            # Repo: tik resources/cfg (be sudo cp server.cfg — kitaip root ownership sulaužo txAdmin).
            sync_resources "$REPO_DIR" 0
          fi

          if ! grep -q 'sv_enforceGameBuild 3095' "$SERVER_DIR/server.cfg"; then
            echo "[deploy] ERROR: $SERVER_DIR/server.cfg neturi sv_enforceGameBuild 3095!"
            exit 1
          fi

          bash "$REPO_DIR/scripts/patch-txadmin-build.sh" /home/fivem || echo "[deploy] txAdmin build patch skipped"

          # Keep runtime C++ libs discoverable for FXServer on Debian hosts.
          sudo -n mkdir -p "$SERVER_DIR/alpine/lib"
          if [ -f "$SERVER_DIR/alpine/usr/lib/libstdc++.so.6" ]; then
            sudo -n ln -sf "$SERVER_DIR/alpine/usr/lib/libstdc++.so.6" "$SERVER_DIR/alpine/lib/libstdc++.so.6"
          fi
          if [ -f "$SERVER_DIR/alpine/usr/lib/libgcc_s.so.1" ]; then
            sudo -n ln -sf "$SERVER_DIR/alpine/usr/lib/libgcc_s.so.1" "$SERVER_DIR/alpine/lib/libgcc_s.so.1"
          fi

          sudo -n systemctl restart fivem-txadmin
          echo "[deploy] Laukiama fivem-txadmin..."
          ok=0
          for i in $(seq 1 20); do
            if sudo -n systemctl is-active --quiet fivem-txadmin; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "[deploy] ERROR: fivem-txadmin nepasileido per 60s"
            sudo -n systemctl status fivem-txadmin --no-pager || true
            sudo -n journalctl -u fivem-txadmin -n 50 --no-pager || true
            exit 1
          fi
          echo "[deploy] done — fivem-txadmin active"

          echo "[deploy] Discord bot restart..."
          if bash "$REPO_DIR/scripts/restart-discord-bot.sh"; then
            echo "[deploy] mrp-discord active"
          else
            echo "[deploy] WARNING: Discord bot restart nepavyko (jei dar neįdiegtas: sudo bash $REPO_DIR/scripts/setup-discord-bot.sh)"
          fi
