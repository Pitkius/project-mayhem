name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Deploy on VPS self-hosted runner
        run: |
          set -euxo pipefail
          REPO_DIR="/home/fivem/FIVEMPROJEKTAS"
          SERVER_DIR="/home/fivem/server"

          echo "[deploy] runner user: $(whoami)"
          test -d "$REPO_DIR"
          test -d "$SERVER_DIR"

          cd "$REPO_DIR"
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          git clean -fd
          git submodule sync --recursive
          git submodule update --init --recursive

          echo "[deploy] Atnaujinami FXServer artifacts (3788 palaikymui)..."
          sudo -n systemctl stop fivem-txadmin || true
          sleep 5
          if ! bash "$REPO_DIR/scripts/update-fivem-artifacts.sh" "$SERVER_DIR"; then
            echo "[deploy] ERROR: artifact atnaujinimas nepavyko — Kortz auto neveiks be naujausio FXServer!"
          fi
          if [ "$SERVER_DIR" != "$REPO_DIR" ] && [ -d "$REPO_DIR/alpine" ]; then
            bash "$REPO_DIR/scripts/update-fivem-artifacts.sh" "$REPO_DIR" || echo "[deploy] REPO artifact update skipped/failed"
          fi

          deploy_to() {
            local target="$1"
            [ -d "$target" ] || return 0
            echo "[deploy] Sync -> $target"
            sudo -n mkdir -p "$target/resources" "$target/cfg"
            sudo -n rsync -a --delete "$REPO_DIR/resources/" "$target/resources/"
            sudo -n rsync -a --delete --exclude '00_base.cfg' "$REPO_DIR/cfg/" "$target/cfg/"
            sudo -n cp "$REPO_DIR/server.cfg" "$target/server.cfg"
          }

          deploy_to "$SERVER_DIR"
          if [ "$SERVER_DIR" != "$REPO_DIR" ]; then
            deploy_to "$REPO_DIR"
          fi

          if ! grep -q 'sv_enforceGameBuild 3788' "$SERVER_DIR/server.cfg"; then
            echo "[deploy] ERROR: server.cfg neturi sv_enforceGameBuild 3788!"
            exit 1
          fi

          bash "$REPO_DIR/scripts/patch-txadmin-build.sh" /home/fivem || echo "[deploy] txAdmin build patch skipped"

          # Keep runtime C++ libs discoverable for FXServer on Debian hosts.
          sudo -n mkdir -p "$SERVER_DIR/alpine/lib"
          if [ -f "$SERVER_DIR/alpine/usr/lib/libstdc++.so.6" ]; then
            sudo -n ln -sf "$SERVER_DIR/alpine/usr/lib/libstdc++.so.6" "$SERVER_DIR/alpine/lib/libstdc++.so.6"
          fi
          if [ -f "$SERVER_DIR/alpine/usr/lib/libgcc_s.so.1" ]; then
            sudo -n ln -sf "$SERVER_DIR/alpine/usr/lib/libgcc_s.so.1" "$SERVER_DIR/alpine/lib/libgcc_s.so.1"
          fi

          sudo -n systemctl restart fivem-txadmin
          sleep 3
          sudo -n systemctl is-active --quiet fivem-txadmin
          echo "[deploy] done"
